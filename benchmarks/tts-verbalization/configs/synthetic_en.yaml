# Same seven Replicate models and the same two recognizers as
# replicate_open10.yaml. The ONLY difference is the corpus: 1,080
# synthetic en-US items we generated and own, in place of the 540
# PolyNorm rows we may use but not redistribute.
#
# Regenerate the corpus with:  python gen_corpus.py --locale en-US
# It is deterministic from the seed plus data/spec/en.yaml, so this
# config plus that file plus the seed reproduces the run exactly.
#
# Absolute rates here are NOT continuous with the PolyNorm numbers.
# Different corpus, different difficulty. Per-category ordering is the
# comparable quantity.
# Generated by replicate_probe.py from each model's published
# input schema. FILL_ME means the field is required and has no
# default -- a guess there is a failed prediction.
dataset:
  type: synthetic
  path: data/synthetic/en-US.jsonl

asr:
  - id: openai-whisper-1
    type: http
    upload: multipart
    normalizes_output: true
    revision: whisper-1
    endpoint: "https://api.openai.com/v1/audio/transcriptions"
    headers:
      Authorization: "Bearer ${OPENAI_API_KEY}"
    form:
      model: whisper-1
      response_format: json
    json_path: text

  # SECOND OPINION ONLY, never a scorer. Deepgram failed the validation gate
  # with 2 false positives in 40 clips: its language model expands
  # abbreviations (mph -> "miles per hour", mg -> "milligrams"), which can
  # repair a broken verbalization into a passing one. It is here to answer a
  # different question -- whether the RANKING survives a change of ASR family
  # (arXiv:2607.08256). score.py refuses to mix lineages, so the published
  # whisper-1 numbers cannot be contaminated by its presence.
  - id: deepgram-nova-3
    type: http
    upload: raw
    normalizes_output: false
    revision: nova-3/no-format
    endpoint: "https://api.deepgram.com/v1/listen?model=nova-3&smart_format=false&numerals=false&punctuate=false"
    headers:
      Authorization: "Token ${DEEPGRAM_API_KEY}"
      Content-Type: audio/wav
    json_path: results.channels.0.alternatives.0.transcript

tts:
  - id: kokoro-82m
    type: replicate
    model: jaaari/kokoro-82m
    version: f559560eb822dc509045f3921a1921234918b91739db4bf3daab2169b71c7a13
    revision: kokoro-82m@f559560e
    input:
      text: "{{text}}"
      voice: "af_bella"

  - id: chatterbox
    type: replicate
    model: resemble-ai/chatterbox
    version: 1b8422bc49635c20d0a84e387ed20879c0dd09254ecdb4e75dc4bec10ff94e97
    revision: chatterbox@1b8422bc
    input:
      prompt: "{{text}}"

  - id: chatterbox-turbo
    type: replicate
    model: resemble-ai/chatterbox-turbo
    version: 95c87b883ff3e842a1643044dff67f9d204f70a80228f24ff64bffe4a4b917d4
    revision: chatterbox-turbo@95c87b88
    input:
      text: "{{text}}"
      voice: "Andy"

  - id: chatterbox-multilingual
    type: replicate
    model: resemble-ai/chatterbox-multilingual
    version: 9cfba4c265e685f840612be835424f8c33bdee685d7466ece7684b0d9d4c0b1c
    revision: chatterbox-multilingual@9cfba4c2
    input:
      text: "{{text}}"

  - id: qwen3-tts
    type: replicate
    model: qwen/qwen3-tts
    version: d490a561cf1171a8dc3d96d1e57efffea7dd34607148bb641f3d9de4e38c472e
    revision: qwen3-tts@d490a561
    input:
      text: "{{text}}"
      speaker: "Serena"

  - id: orpheus-3b
    type: replicate
    model: lucataco/orpheus-3b-0.1-ft
    version: 79f2a473e6a9720716a473d9b2f2951437dbf91dc02ccb7079fb3d89b881207f
    revision: orpheus-3b-0.1-ft@79f2a473
    input:
      text: "{{text}}"
      voice: "tara"

  # DROPPED. Measured at ~9.9s/item, roughly 45x kokoro and the slowest
  # model in the set by a wide margin. Not a quality judgement: at that
  # latency it is not a candidate for a voice agent, and it would add ~90
  # minutes to every full run for a model that cannot be used in the product.
  - id: csm-1b
    type: replicate
    enabled: false
    model: lucataco/csm-1b
    version: 3e59b10a9894c54ae5f2fc0347e3a2f5c82f0574407e53a7d9f76ec7c502ad03
    revision: csm-1b@3e59b10a
    input:
      text: "{{text}}"
      speaker: 0

  # DROPPED. Dia is a DIALOGUE model: given a bare sentence it invents
  # surrounding conversation and non-verbal sounds. Measured 19.6s and 12.3s of
  # audio for 29-character inputs where every other model produced 1.4-4.3s.
  # The screener rejects those as implausibly_long, so its denominator would
  # collapse, and whatever it generates past the target span is not the
  # sentence under test. Not a quality judgement -- a task mismatch.
  - id: dia-1.6b
    type: replicate
    enabled: false
    model: zsxkib/dia
    version: 2119e338ca5c0dacd3def83158d6c80d431f2ac1024146d8cca9220b74385599
    revision: dia@2119e338
    input:
      text: "{{text}}"

  - id: parler-tts
    type: replicate
    model: cjwbw/parler-tts
    version: bf38249a8cc143b97b5108570d1c81b8321881dd91fe7837877e7dfa3a0fad27
    # description STEERS the voice and is not optional in practice. Leaving it
    # unset applies the wrapper default, which ends "She speaks very fast" --
    # Parler is unstable at speed and returned truncated gibberish ("Die Evente
    # sind verkaufsfaehig." for "The event is on 05/20/2023."). Scoring that
    # would report a default I failed to override as a property of the model.
    # Neutral, slow, clean: the fairest configuration for a clarity test.
    revision: parler-tts@bf38249a+desc-clear
    input:
      prompt: "{{text}}"
      description: "A female speaker delivers her words clearly and slowly, with very high quality audio and no background noise."

  # DROPPED. suno-ai/bark is a 4-year-old wrapper that could not leave
  # "starting" within 300s on two attempts -- it never reached processing, so
  # there is no quality number to report, only an availability one. MIT and
  # clean on licence, impractical in fact. Re-enable by removing `enabled:
  # false` if its cold start ever improves.
  - id: bark
    type: replicate
    enabled: false
    model: suno-ai/bark
    version: b76242b40d67c76ab6742e987628a2a9ac019e11d56ab96c4e91ce03b79b2787
    output_path: audio_out
    revision: bark@b76242b4
    input:
      prompt: "{{text}}"
